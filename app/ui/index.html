<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>get-video</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@4/dist/dash.all.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #1e1f24; color: #e8e8ea; }
  header { padding: 16px 20px 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b8d94; font-size: 12px; }
  .bar { display: flex; gap: 8px; padding: 12px 20px; }
  input { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3b42; background: #14151a; color: #e8e8ea; font-size: 14px; }
  button { padding: 10px 18px; border-radius: 8px; border: 0; background: #4a7dff; color: #fff; font-size: 14px; cursor: pointer; }
  button.alt { background: #3d5bb5; }
  button:disabled { background: #3a3b42; cursor: not-allowed; }
  #status { padding: 0 20px; font-size: 13px; color: #9fb4ff; min-height: 20px; }
  #status.err { color: #ff8a8a; }
  ul { list-style: none; margin: 8px 20px; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 6px; background: #26272e; border-radius: 8px; cursor: pointer; font-size: 13px; }
  li:hover { background: #2f3038; }
  li.drm { opacity: .45; cursor: not-allowed; }
  li .idx { color: #8b8d94; width: 22px; }
  .tag { padding: 1px 7px; border-radius: 5px; font-size: 11px; background: #37415e; color: #9fb4ff; }
  .tag.drm { background: #5e3737; color: #ff9f9f; }
  .tag.q { background: #375e46; color: #9fffc3; }
  .tag.cast { background: #5e4a37; color: #ffd89f; }
  li .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; color: #b9bbc2; }
  #playerBox { margin: 8px 20px 20px; }
  video { width: 100%; max-height: 46vh; background: #000; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>get-video · 视频解析与投屏</h1>
  <div class="sub">输入视频页网址点「解析」：先秒级快速解析，未命中自动深度解析（最长约 15 秒） · 点击结果本机播放 · 点「投屏」复制局域网地址给手机/电视 · 「登录」用于需登录的站点</div>
</header>
<div class="bar">
  <input id="url" placeholder="https://example.com/page-with-video" autofocus>
  <button id="btnGo">解析</button>
  <button id="btnLogin" class="alt">登录</button>
</div>
<div id="status"></div>
<ul id="list"></ul>
<div id="playerBox"><video id="player" controls></video></div>
<script>
const $ = (id) => document.getElementById(id);
const invoke = window.__TAURI__.core.invoke;
let hls = null;
let dash = null;
let busy = false;
// 局域网 relay 基地址（投屏用），启动后从 Rust 侧取
let lanBase = '';
// 最近一批解析结果（探针异步打标/播放自检时更新）
let lastItems = [];
let lastResp = null;
invoke('lan_addr').then((b) => { lanBase = b; }).catch(() => {});

// 解码探针异步回标：后台实测画面异常的流，收到事件后给对应链接打「受限，不能播放」
try {
  window.__TAURI__.event.listen('probe-restriction', (e) => {
    const { url, reason } = e.payload || {};
    const it = lastItems.find((r) => r.url === url);
    if (!it || it.restriction) return;
    it.restriction = reason || 'WASM 私有加扰，实测解码画面异常，无法播放';
    it.relay_url = null;
    if (lastResp) render(lastResp);
    setStatus('探针实测：1 条流画面异常（私有加扰），已标注受限');
  });
} catch (e) {}

function setStatus(t, isErr) {
  $('status').textContent = t || '';
  $('status').className = isErr ? 'err' : '';
}

function trunc(u) { return u.length > 90 ? u.slice(0, 60) + '…' + u.slice(-26) : u; }

// 归一化两种响应：extract 返回 VideoInfo（formats 数组），sniff 返回 SniffResponse（results 数组）
function normalize(resp) {
  if (resp.formats) return resp.formats.map((f, i) => ({ ...f, index: i }));
  return resp.results || [];
}

function render(resp) {
  const items = normalize(resp);
  lastItems = items;
  lastResp = resp;
  const count = resp.count !== undefined ? resp.count : items.length;
  const list = $('list');
  list.innerHTML = '';
  document.title = 'results:' + count;
  try { window.__TAURI__.event.emit('ui-results', { count }); } catch (e) {}
  if (!items.length) return;
  for (const r of items) {
    // 受限（WASM 加扰 / 全站 DRM）或流级 DRM：链接后注明「受限，不能播放」
    const blocked = !!r.restriction || r.drm;
    const reason = r.restriction || 'DRM 加密内容，无法播放';
    const li = document.createElement('li');
    li.innerHTML =
      `<span class="idx">${r.index + 1}</span>` +
      `<span class="tag">${r.protocol}</span>` +
      (r.quality ? `<span class="tag q">${r.quality}</span>` : '') +
      (blocked ? `<span class="tag drm">受限，不能播放</span>` : '') +
      `<span class="url" title="${r.url}">${trunc(r.url)}</span>`;
    if (blocked) {
      li.className = 'drm';
      li.title = reason;
    } else {
      li.onclick = () => play(r);
    }
    if (r.relay_url) {
      // 「投屏」：复制局域网 relay 地址，手机/电视同 Wi-Fi 下用浏览器或播放器打开
      const cast = document.createElement('span');
      cast.className = 'tag cast';
      cast.textContent = '投屏';
      cast.title = '复制局域网播放地址（手机/电视需与电脑同一 Wi-Fi）';
      cast.onclick = (e) => {
        e.stopPropagation();
        const u = r.relay_url.replace(/^http:\/\/127\.0\.0\.1:\d+/, lanBase);
        navigator.clipboard.writeText(u).then(
          () => setStatus('投屏地址已复制，手机/电视打开即可播: ' + trunc(u)),
          () => setStatus('投屏地址（复制失败请手动记录）: ' + u, true)
        );
      };
      li.appendChild(cast);
    }
    list.appendChild(li);
  }
}

function play(r) {
  const v = $('player');
  if (hls) { hls.destroy(); hls = null; }
  if (dash) { dash.reset(); dash = null; }
  if (!r.relay_url) { setStatus('该格式无 relay 地址，无法播放', true); return; }
  // relay 带 CORS：开 anonymous 让 canvas 抽帧自检可读
  v.crossOrigin = 'anonymous';
  setStatus('播放: ' + trunc(r.url));
  if (r.protocol === 'hls') {
    if (v.canPlayType('application/vnd.apple.mpegurl')) {
      // WebKit 原生 HLS 优先：对直播流（中途加 GOP、超大 PTS）容错远好于 hls.js/MSE，
      // 实测央视签名直播流 hls.js 报 bufferAppendError，原生播放正常
      v.src = r.relay_url;
    } else if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(r.relay_url);
      hls.attachMedia(v);
      hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setStatus('播放错误: ' + d.details, true); });
    } else {
      setStatus('当前 webview 不支持 HLS 播放', true); return;
    }
  } else if (r.protocol === 'dash') {
    // DASH 音画分轨：relay 侧已合成 MPD，dash.js 负责音画同步
    if (typeof dashjs === 'undefined') { setStatus('dash.js 未加载（需联网取 CDN）', true); return; }
    dash = dashjs.MediaPlayer().create();
    dash.initialize(v, r.relay_url, true);
    dash.on('error', (e) => setStatus('播放错误: ' + (e.error && e.error.message || e.error || e), true));
  } else if (r.protocol === 'mp4') {
    v.src = r.relay_url;
  } else {
    setStatus('播放器暂不支持 ' + r.protocol + '（地址已复制到控制台）', true);
    console.log(r.relay_url); return;
  }
  v.play().catch(() => {});
  // 播放自检（对所有站点生效的兜底网）：6s 后抽一帧，画面平坦（std<1.5，
  // 纯黑/纯色）且进度确实在走 → 疑似私有加扰，给该条打受限标注。
  // 阈值取自央视频直播实测（mean=0, std=0）；正常内容 std 一般 >25。
  setTimeout(() => {
    try {
      if (v.paused || !v.videoWidth || v.currentTime < 3) return;
      const c = document.createElement('canvas');
      c.width = v.videoWidth; c.height = v.videoHeight;
      const x = c.getContext('2d');
      x.drawImage(v, 0, 0);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let s = 0, sq = 0;
      const n = d.length / 4;
      for (let i = 0; i < d.length; i += 4) {
        const l = (d[i] + d[i+1] + d[i+2]) / 3;
        s += l; sq += l * l;
      }
      const mean = s / n;
      const std = Math.sqrt(Math.max(0, sq / n - mean * mean));
      if (std < 1.5) {
        r.restriction = 'WASM 私有加扰，实测解码画面异常，无法播放';
        r.relay_url = null;
        if (lastResp) render(lastResp);
        setStatus('该流实测画面异常（疑似私有加扰），已标注受限', true);
      }
    } catch (e) {}
  }, 6000);
}

// 统一解析：先 L1/L3 快速提取，未命中（或失败）自动转 L2 深度嗅探。
// 用户不需要知道两层的区别——对外的语义只有「解析」。
async function run() {
  const url = $('url').value.trim();
  if (!url) { setStatus('请输入网址', true); return; }
  if (busy) return;
  busy = true;
  $('btnGo').disabled = true;
  $('list').innerHTML = '';
  setStatus('解析中…');
  try {
    // 第一层：快速提取（秒级）；返回 0 条或出错都自动转第二层
    let resp = null;
    try {
      const r0 = await invoke('extract', { url });
      if (normalize(r0).length) resp = r0;
    } catch (e) { /* 提取失败不报错，直接转嗅探 */ }
    if (!resp) {
      setStatus('快速解析未命中，自动深度解析（最长约 15 秒）…');
      resp = await invoke('sniff', { url });
    }
    const items = normalize(resp);
    const count = resp.count !== undefined ? resp.count : items.length;
    if (!count) {
      setStatus(resp.note || '未解析到可播放的视频地址', true);
    } else {
      const title = resp.title ? `《${resp.title}》` : '';
      setStatus(`解析到 ${count} 条结果 ${title}`.trim());
    }
    render(resp);
  } catch (e) {
    setStatus('解析失败: ' + e, true);
    document.title = 'results:0';
  } finally {
    busy = false;
    $('btnGo').disabled = false;
  }
}

// go() 保留给 --ui-test 注入调用（走完整 IPC 链路）
function go() { run(); }
$('btnGo').onclick = go;
$('btnLogin').onclick = async () => {
  const url = $('url').value.trim();
  if (!url) { setStatus('先输入要登录的站点网址', true); return; }
  try {
    await invoke('open_login', { url });
    setStatus('登录窗口已打开：完成登录后关闭它，再点「解析」');
  } catch (e) { setStatus('打开登录窗口失败: ' + e, true); }
};
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
try { window.__TAURI__.event.emit('ui-ready', {}); } catch (e) {}
</script>
</body>
</html>
