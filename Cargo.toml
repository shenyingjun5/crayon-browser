[package]
name = "crayon-browser-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Crayon formal core with an explicitly gated legacy extraction/relay mode"
publish = false

[features]
default = ["formal-product"]
formal-product = []
legacy-dev = [
    "dep:axum",
    "dep:base64",
    "dep:clap",
    "dep:futures-util",
    "dep:percent-encoding",
    "dep:regex",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
]

[workspace]
resolver = "2"
members = [
    "crates/crayon-agent-gateway",
    "crates/crayon-app-runtime",
    "crates/crayon-cast-adapter",
    "crates/crayon-domain",
    "crates/crayon-ipc-schema",
    "crates/crayon-legacy-adapter",
    "crates/crayon-media-probe",
    "crates/crayon-media-observer",
    "crates/crayon-cast-policy",
    "crates/crayon-profile",
    "crates/crayon-platform-api",
    "crates/crayon-platform-capabilities",
    "tools/repo-guard",
    "test-support",
    "crates/crayon-relay",
]
exclude = ["app", "demo", "third_party/cast-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints]
workspace = true

[lib]
name = "crayon_browser_core"
path = "src/lib.rs"

[[bin]]
name = "crayon-legacy-video-tool"
path = "src/main.rs"
required-features = ["legacy-dev"]

[[test]]
name = "legacy_contract"
path = "tests/architecture/legacy_contract.rs"

[[test]]
name = "fixtures"
path = "tests/fixtures.rs"
required-features = ["legacy-dev"]

[[test]]
name = "online"
path = "tests/online.rs"
required-features = ["legacy-dev"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["legacy-dev"]

[dependencies]
crayon-app-runtime = { path = "crates/crayon-app-runtime" }
crayon-cast-policy = { path = "crates/crayon-cast-policy" }
crayon-domain = { path = "crates/crayon-domain" }
crayon-ipc-schema = { path = "crates/crayon-ipc-schema" }
crayon-media-observer = { path = "crates/crayon-media-observer" }
crayon-media-probe = { path = "crates/crayon-media-probe" }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
reqwest = { version = "0.12", default-features = false, optional = true, features = [
    "rustls-tls",
    "stream",
    "gzip",
] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
regex = { version = "1", optional = true }
url = { version = "2", optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3", optional = true }
percent-encoding = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
test-support = { path = "test-support" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "gzip",
] }
axum = "0.8"
