[package]
name = "crayon-agent-cli"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[dependencies]
crayon-agent-gateway = { path = "../../crates/crayon-agent-gateway" }
crayon-domain = { path = "../../crates/crayon-domain" }
crayon-ipc-schema = { path = "../../crates/crayon-ipc-schema" }
crayon-platform-api = { path = "../../crates/crayon-platform-api" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
crayon-platform-macos = { path = "../../crates/crayon-platform-macos" }

[[bin]]
name = "agent-cli"
path = "src/main.rs"
