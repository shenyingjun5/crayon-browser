# 蜡笔隐私投屏浏览器产品默认值（非秘密配置）。
#
# 规则：本文件只允许非秘密默认值；任何 password/secret/token/cookie/
# authorization/api_key/private_key 字样的键会在加载时被拒绝（稳定错误
# config_secret_not_allowed）。校验失败即阻止启动，不做 best-effort 降级。
schema_version = 1

[network]
# 会话 relay 与本机控制面的端口分配范围（含端点；两段不得重叠）。
relay_port_min = 20000
relay_port_max = 29999
control_port_min = 30000
control_port_max = 30999

[timeouts]
connect_seconds = 10
read_idle_seconds = 10
# 投屏会话 TTL：默认 2 小时，上限 24 小时（技术方案 §11.2）。
session_ttl_seconds = 7200

[capacity]
max_sessions = 32
max_requests_per_session = 4096
max_message_bytes = 65536

[update]
# stable | beta | dev（三渠道 Profile 隔离，技术方案 §17）。
channel = "stable"

[logging]
# error | warn | info | debug；热路径默认不产生逐帧/逐分片日志。
level = "info"
# 隐私契约（技术方案 §15）：日志默认对 URL 脱敏。
redact_urls = true
