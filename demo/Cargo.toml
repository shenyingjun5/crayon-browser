[package]
name = "get-video-demo"
version = "0.1.0"
edition = "2021"
description = "get-video L2 webview 嗅探 Tauri demo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
get-video = { path = ".." }
tauri = { version = "2.11.5", features = [] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
