[package]
name = "get-video-demo"
version = "0.1.0"
edition = "2021"
description = "Legacy-dev Tauri webview sniffing demo; not a formal product target"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
get-video = { path = "..", default-features = false, features = ["legacy-dev"] }
tauri = { version = "2.11.5", features = [] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
