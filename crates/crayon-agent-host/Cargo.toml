[package]
name = "crayon-agent-host"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
crayon-agent-gateway = { path = "../crayon-agent-gateway" }
crayon-domain = { path = "../crayon-domain" }
crayon-ipc-schema = { path = "../crayon-ipc-schema" }
crayon-platform-api = { path = "../crayon-platform-api" }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
crayon-platform-macos = { path = "../crayon-platform-macos" }

[dev-dependencies]
serde = "1"
