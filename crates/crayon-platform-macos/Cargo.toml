[package]
name = "crayon-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "macOS platform adapters for the PLT-01 interface contracts (PLT-M04)"
publish = false

# This crate performs Security.framework / CoreFoundation / libc FFI,
# which the workspace-wide `unsafe_code = forbid` lint cannot express.
# All unsafe code stays inside `ffi.rs`, every block carries a SAFETY
# comment, and undocumented unsafe blocks are denied below.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
crayon-platform-api = { path = "../crayon-platform-api" }
crayon-platform-capabilities = { path = "../crayon-platform-capabilities" }

[dev-dependencies]
serde_json = "1"
