[package]
name = "crayon-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windows platform adapters for the PLT-01 interface contracts (PLT-W04)"
publish = false

# This crate performs Win32 FFI, which the workspace-wide
# `unsafe_code = forbid` lint cannot express.  All unsafe code stays inside
# `ffi.rs`, every block carries a SAFETY comment, and undocumented unsafe
# blocks are denied below.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
crayon-platform-api = { path = "../crayon-platform-api" }
crayon-platform-capabilities = { path = "../crayon-platform-capabilities" }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
