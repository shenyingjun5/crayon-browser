[package]
name = "crayon-media-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform composition binary for the isolated Crayon media host"
publish = false

[lints]
workspace = true

[dependencies]
crayon-app-runtime = { path = "../crayon-app-runtime" }
crayon-cast-adapter = { path = "../crayon-cast-adapter" }
crayon-ipc-schema = { path = "../crayon-ipc-schema" }
crayon-media-probe = { path = "../crayon-media-probe" }
crayon-relay = { path = "../crayon-relay" }
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
crayon-platform-api = { path = "../crayon-platform-api" }
crayon-platform-windows = { path = "../crayon-platform-windows" }
