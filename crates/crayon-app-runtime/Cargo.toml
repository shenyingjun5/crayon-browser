[package]
name = "crayon-app-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Platform-neutral Crayon product runtime composition"
publish = false

[lints]
workspace = true

[dependencies]
crayon-cast-policy = { path = "../crayon-cast-policy" }
crayon-domain = { path = "../crayon-domain" }
crayon-ipc-schema = { path = "../crayon-ipc-schema" }
crayon-media-observer = { path = "../crayon-media-observer" }
crayon-media-probe = { path = "../crayon-media-probe" }
crayon-relay = { path = "../crayon-relay" }
url = "2"

[dev-dependencies]
serde_json = "1"
test-support = { path = "../../test-support" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
