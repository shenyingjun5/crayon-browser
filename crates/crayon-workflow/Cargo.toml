[package]
name = "crayon-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Bounded workflow learning services"
publish = false

[lints]
workspace = true

[dependencies]
crayon-agent-gateway = { path = "../crayon-agent-gateway" }
crayon-domain = { path = "../crayon-domain" }
crayon-platform-api = { path = "../crayon-platform-api" }
crayon-semantic-action = { path = "../crayon-semantic-action" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dev-dependencies]
crayon-platform-windows = { path = "../crayon-platform-windows" }
