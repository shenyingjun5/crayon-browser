[package]
name = "crayon-relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Session-scoped media relay: opaque tokens, TTL, receiver binding, revocation"
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
crayon-domain = { path = "../crayon-domain" }
crayon-ipc-schema = { path = "../crayon-ipc-schema" }
crayon-media-probe = { path = "../crayon-media-probe" }
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync"] }
url = "2"
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
test-support = { path = "../../test-support" }
tokio = { version = "1", features = ["full"] }
