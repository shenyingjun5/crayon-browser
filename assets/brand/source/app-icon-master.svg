<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">蜡笔 AI Agent 投屏浏览器</title>
  <desc id="description">蓝色圆角底板上的浏览器窗口与斜向蜡笔</desc>
  <defs>
    <linearGradient id="backgroundGradient" x1="96" y1="52" x2="914" y2="972" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4288f7"/>
      <stop offset="0.52" stop-color="#3274ec"/>
      <stop offset="1" stop-color="#3f83f4"/>
    </linearGradient>
    <linearGradient id="creamGradient" x1="250" y1="170" x2="730" y2="845" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#eee8de"/>
    </linearGradient>
    <linearGradient id="tipGradient" x1="482" y1="468" x2="578" y2="516" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#29a486"/>
      <stop offset="1" stop-color="#168d78"/>
    </linearGradient>
  </defs>

  <rect id="background" width="1024" height="1024" rx="96" fill="url(#backgroundGradient)"/>

  <g id="browser" fill="none" stroke="url(#creamGradient)" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M 222 657 V 280 C 222 224 260 184 314 184 H 744 C 802 184 842 228 842 282 V 744 C 842 802 800 840 744 840 H 425" stroke-width="52"/>
    <path d="M 222 307 H 842" stroke-width="48"/>
  </g>

  <g id="browser-controls" fill="url(#creamGradient)">
    <circle cx="280" cy="239" r="18"/>
    <circle cx="342" cy="239" r="18"/>
    <circle cx="404" cy="239" r="18"/>
    <path d="M 510 282 L 540 231 Q 550 216 570 216 H 742 Q 766 216 778 238 L 802 282 Z"/>
  </g>

  <g id="crayon" stroke="#3376ed" stroke-linejoin="round">
    <path d="M 228 643 L 475 469 L 546 560 L 393 805 Z" fill="url(#creamGradient)" stroke-width="12"/>
    <path d="M 475 469 Q 564 411 587 430 Q 608 448 546 560 Z" fill="url(#tipGradient)" stroke-width="10"/>
    <path d="M 475 469 L 546 560" fill="none" stroke-width="8"/>
    <ellipse cx="266" cy="758" rx="76" ry="108" transform="rotate(-39 266 758)" fill="url(#creamGradient)" stroke-width="14"/>
  </g>
</svg>
